  <script>
  (function(){
    "use strict";
    const KEY="common-ground-tracker-v1",now=new Date(),today=localDate(now);
    const starter={meetings:[
      {id:"m-1",title:"November residents' committee",type:"Monthly committee",date:"2026-11-28",time:"18:30",location:"Clubhouse · Hall A",attendance:5,agenda:["CCTV camera upgrade at Gate 2","Rainwater harvesting pit desilting","Q4 maintenance reserve"],minutes:"",status:"upcoming",archived:false},
      {id:"m-2",title:"Diwali & Q3 review",type:"Monthly committee",date:"2026-10-18",time:"17:00",location:"Clubhouse · Main lounge",attendance:5,agenda:["Festival arrangements","Q3 maintenance audit"],minutes:"Reviewed festival arrangements and approved the quarterly maintenance report.",status:"completed",archived:true},
      {id:"m-3",title:"Monsoon readiness check-in",type:"Special meeting",date:"2026-09-12",time:"18:00",location:"Tower A · Community room",attendance:4,agenda:["Drainage inspection","Lift AMC renewal"],minutes:"The committee agreed to renew the lift maintenance contract and improve basement drainage.",status:"completed",archived:true}],
      decisions:[
        {id:"d-1",title:"Approve SecureVision quote for six Gate 2 cameras",meeting:"m-1",outcome:"Approved",date:"2026-11-22"},
        {id:"d-2",title:"Set aside maintenance funds for rainwater pit cleaning",meeting:"m-1",outcome:"Approved",date:"2026-11-22"},
        {id:"d-3",title:"Draft shared EV charging guidelines",meeting:"m-1",outcome:"Deferred",date:"2026-11-22"},
        {id:"d-4",title:"Transfer Q3 surplus to the community reserve",meeting:"m-2",outcome:"Approved",date:"2026-10-18"}],
      actions:[
        {id:"a-1",title:"Send resident notice for Gate 2 camera installation",owner:"Mayank Yadav",due:"2026-11-22",status:"In progress",reminder:true,decision:"d-1"},
        {id:"a-2",title:"Confirm vendor schedule and release the deposit",owner:"Satyam Yadav",due:"2026-11-27",status:"In progress",reminder:true,decision:"d-1"},
        {id:"a-3",title:"Coordinate cleaning of rainwater pits 1–4",owner:"Shresht Sharma",due:"2026-11-30",status:"To do",reminder:true,decision:"d-2"},
        {id:"a-4",title:"Collect fire-safety guidance for EV charging",owner:"Rajesh Kulkarni",due:"2026-11-21",status:"To do",reminder:true,decision:"d-3"},
        {id:"a-5",title:"Share the Q3 financial summary with residents",owner:"Mayank Yadav",due:"2026-10-25",status:"Completed",reminder:false,decision:"d-4"}]};
    let data=load(),page="overview",search="",filter="all",toastTimer;
    function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
    function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return JSON.parse(JSON.stringify(starter));const x=JSON.parse(raw);if(!x||!Array.isArray(x.meetings)||!Array.isArray(x.decisions)||!Array.isArray(x.actions))throw Error("Saved data is incomplete");return x}catch(e){console.error("Could not load saved tracker data.",e);return JSON.parse(JSON.stringify(starter))}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.error("Could not save tracker data.",e);toast("Could not save changes in this browser.")}}
    function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function dateObj(s){const p=String(s||"").split("-").map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2]):new Date(NaN)}
    function fmt(s,opt){const d=dateObj(s);return Number.isNaN(d.getTime())?"No date":d.toLocaleDateString(undefined,opt||{month:"short",day:"numeric",year:"numeric"})}
    function tile(s){const d=dateObj(s);return Number.isNaN(d.getTime())?["—","—"]:[d.toLocaleDateString(undefined,{month:"short"}),String(d.getDate()).padStart(2,"0")]}
    function initials(s){return String(s||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
    function byId(id){return data.meetings.find(x=>x.id===id)}function decision(id){return data.decisions.find(x=>x.id===id)}
    function idFor(prefix,list){return prefix+"-"+(Math.max(0,...list.map(x=>Number(x.id.replace(/\D/g,""))||0))+1)}
    function late(a){return a.status!=="Completed"&&a.due&&a.due<today}
    function toast(s){const r=document.getElementById("toast-root");r.innerHTML='<div class="toast" role="status">'+esc(s)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>r.innerHTML="",3000)}
    function icon(name){const p={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',people:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M19 8v6M22 11h-6"/>'};return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(p[name]||p.check)+'</svg>'}
    function head(k,t,s,act){return '<div class="heading"><div><p class="eyebrow">'+k+'</p><h1>'+t+'</h1><p class="sub">'+s+'</p></div>'+(act||"")+'</div>'}
    function stat(label,val,note,color,ico){return '<div class="stat"><div class="stat-label">'+label+'<span class="stat-icon '+color+'">'+icon(ico)+'</span></div><div class="stat-value">'+val+'</div><div class="stat-note">'+note+'</div></div>'}
    function meetingTile(m){const [mo,day]=tile(m.date);return '<div class="meeting-row"><div class="date-tile"><b>'+day+'</b><small>'+mo+'</small></div><div><div class="item-title">'+esc(m.title)+'</div><div class="item-sub">'+esc(m.location)+' · '+esc(m.time)+'</div></div><span class="pill '+(m.status==="completed"?"":"pending")+'">'+(m.status==="completed"?"Completed":"Upcoming")+'</span></div>'}
    function decisionCard(d){const m=byId(d.meeting);return '<div class="decision"><span class="decision-icon">'+icon("check")+'</span><div class="decision-text">'+esc(d.title)+'<div class="item-sub">'+esc(m?m.title:"Meeting record")+' · '+fmt(d.date,{month:"short",day:"numeric"})+'</div></div><span class="pill '+(d.outcome==="Deferred"?"deferred":"")+'">'+esc(d.outcome)+'</span></div>'}
    function taskCard(a){const overdue=late(a);return '<div class="task-row"><span class="priority '+(overdue?"late":"")+'"></span><div><div class="item-title">'+esc(a.title)+'</div><div class="item-sub">'+esc(a.owner)+' · Due '+fmt(a.due,{month:"short",day:"numeric"})+'</div></div><span class="due '+(overdue?"late":"")+'">'+(overdue?"Overdue":"Due "+fmt(a.due,{month:"short",day:"numeric"}))+'</span></div>'}
    function nextMeeting(){return data.meetings.filter(m=>m.status==="upcoming"&&m.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0]}
    function overview(){
      const active=data.actions.filter(a=>a.status!=="Completed"),overdue=active.filter(late),next=nextMeeting(),up=data.meetings.filter(m=>m.status==="upcoming").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3),recent=data.decisions.slice(-3).reverse();
      const agenda=next&&next.agenda.length?next.agenda:["Welcome & community updates","Review open action items","Resident questions"];
      const agendaHtml=agenda.slice(0,4).map((x,i)=>'<div class="agenda-row"><div class="agenda-time">'+(next?esc(next.time):"18:30")+'</div><div><div class="item-title">'+esc(x)+'</div><div class="item-sub">'+["Community committee","Facilities team","Treasurer","Open discussion"][i%4]+'</div></div><span class="duration">'+[15,10,20,15][i%4]+' min</span></div>').join("");
      const feature=next?'<section class="panel feature"><div class="feature-label">Next community meeting · '+fmt(next.date,{weekday:"short",month:"short",day:"numeric"})+'</div><h2>'+esc(next.title)+'</h2><div class="feature-meta"><span>'+icon("clock")+esc(next.time)+'</span><span>'+icon("pin")+esc(next.location)+'</span><span>'+icon("people")+next.attendance+' members invited</span></div><div class="feature-bottom"><small>Committee members · '+next.attendance+' invited</small><button class="btn" data-open-meeting="'+esc(next.id)+'">Meeting details →</button></div></section>':'<section class="panel empty"><b>No upcoming meetings</b>Schedule a meeting to get the conversation started.<br><br><button class="btn primary" data-modal="meeting">Schedule meeting</button></section>';
      const date=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
      return head(esc(date),"Good to see you, Alex","Here’s what’s happening in your community this week.",'<button class="btn primary" data-modal="meeting">'+icon("calendar")+'Schedule a meeting</button>')+
      '<div class="stats">'+stat("Upcoming meetings",data.meetings.filter(m=>m.status==="upcoming").length,"Next: "+(next?fmt(next.date,{month:"short",day:"numeric"}):"Not scheduled"),"g","calendar")+stat("Decisions recorded",data.decisions.length,"Across all meeting records","b","check")+stat("Open action items",active.length,overdue.length?'<b>'+overdue.length+' need attention</b>':"All caught up","o","clock")+stat("Overdue actions",overdue.length,overdue.length?"Follow up with assigned owners":"Nothing overdue","r","clock")+'</div>'+
      '<div class="columns"><div>'+feature+'<section class="panel"><div class="panel-head"><div><h2 class="panel-title">On the agenda</h2><p class="panel-sub">A look at what the committee will discuss</p></div><button class="link" data-page="meetings">All meetings →</button></div>'+agendaHtml+'</section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Recent decisions</h2><p class="panel-sub">A transparent record of what was agreed</p></div><button class="link" data-page="decisions">Decision log →</button></div>'+(recent.length?recent.map(decisionCard).join(""):'<div class="empty">No decisions recorded yet.</div>')+'</section></div>'+
      '<div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Action items</h2><p class="panel-sub">Keep commitments moving forward</p></div><button class="link" data-page="actions">See all →</button></div>'+(active.length?active.slice().sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4).map(taskCard).join(""):'<div class="empty">All caught up — no open items.</div>')+'<button class="btn" style="width:100%;margin-top:8px" data-modal="action">＋ Add an action item</button></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Coming up</h2><p class="panel-sub">Your community calendar</p></div><button class="link" data-page="meetings">Calendar →</button></div>'+(up.length?up.map(meetingTile).join(""):'<div class="empty">No meetings scheduled.</div>')+'</section><section class="panel" style="background:#eff4ef;box-shadow:none"><h2 class="panel-title">A little follow-through goes a long way.</h2><p class="panel-sub">'+active.length+' open action items · '+overdue.length+' overdue</p></section></div></div>'
    }
    function toolbar(placeholder,filters){return '<div class="toolbar"><label class="search">'+icon("check")+'<input id="search" type="search" aria-label="'+placeholder+'" placeholder="'+placeholder+'" value="'+esc(search)+'"></label>'+(filters||"")+'</div>'}
    function meetings(archived){
      let list=data.meetings.filter(m=>Boolean(m.archived)===archived).sort((a,b)=>b.date.localeCompare(a.date)).filter(m=>(m.title+" "+m.location+" "+m.type).toLowerCase().includes(search.toLowerCase()));
      if(archived)return head("Institutional memory","Meeting archive","Past meeting records, minutes and decisions stay easy to find.")+toolbar("Search archived meetings…")+(list.length?list.map(m=>{const ds=data.decisions.filter(d=>d.meeting===m.id),acts=data.actions.filter(a=>ds.some(d=>d.id===a.decision)),attendees=m.attendees||[];return '<details class="panel archive"><summary><span><b class="table-title">'+esc(m.title)+'</b><span class="table-sub">'+fmt(m.date)+' · '+esc(m.location)+'</span></span><span class="pill">Archived</span></summary><div class="archive-content"><p><b>Attendance:</b> '+(attendees.length?attendees.length+" present — "+attendees.map(esc).join(", "):m.attendance+" invited; attendance not recorded")+' · <b>Meeting type:</b> '+esc(m.type)+'</p><p><b>Minutes:</b> '+(m.minutes?esc(m.minutes):"No minutes added.")+'</p><p><b>Agenda:</b> '+m.agenda.map(esc).join(" · ")+'</p><p><b>Decisions:</b></p><ul>'+(ds.length?ds.map(d=>'<li>'+esc(d.title)+' — '+esc(d.outcome)+'</li>').join(""):'<li>No decisions recorded.</li>')+'</ul><p><b>Linked action items:</b> '+acts.length+'</p></div></details>'}).join(""):'<div class="panel empty"><b>No archived meetings found</b>Completed meetings can be archived from the meeting details.</div>');
      const rows=list.map(m=>{const [mo,day]=tile(m.date);return '<tr><td><div class="table-title">'+esc(m.title)+'</div><div class="table-sub">'+esc(m.type)+'</div></td><td>'+fmt(m.date)+'<div class="table-sub">'+esc(m.time)+'</div></td><td>'+esc(m.location)+'</td><td>'+m.attendance+' members</td><td><span class="pill '+(m.status==="completed"?"":"pending")+'">'+(m.status==="completed"?"Completed":"Upcoming")+'</span></td><td><button class="table-btn" data-open-meeting="'+esc(m.id)+'">Details</button></td></tr>'}).join("");
      return head("Plan & reflect","Community meetings","Schedule gatherings, share the agenda, and keep a clear record.",'<button class="btn primary" data-modal="meeting">'+icon("calendar")+'New meeting</button>')+toolbar("Search meetings…")+'<div class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Meeting</th><th>Date & time</th><th>Location</th><th>Attendance</th><th>Status</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6"><div class="empty"><b>No meetings found</b>Try a different search or schedule a new meeting.</div></td></tr>')+'</tbody></table></div></div>'
    }
    function decisionsPage(){
      const list=data.decisions.slice().reverse().filter(d=>(d.title+" "+d.outcome+" "+(byId(d.meeting)||{}).title).toLowerCase().includes(search.toLowerCase()));
      const rows=list.map(d=>'<tr><td><div class="table-title">'+esc(d.title)+'</div><div class="table-sub">'+esc(byId(d.meeting)?byId(d.meeting).title:"Meeting record")+'</div></td><td>'+fmt(d.date)+'</td><td><span class="pill '+(d.outcome==="Deferred"?"deferred":"")+'">'+esc(d.outcome)+'</span></td><td>'+data.actions.filter(a=>a.decision===d.id).length+' linked</td><td><button class="table-btn" data-action-for="'+esc(d.id)+'">＋ Action</button></td></tr>').join("");
      return head("What we agreed","Decision log","Every resolution, its outcome, and the work that follows.",'<button class="btn primary" data-modal="decision">'+icon("check")+'Record decision</button>')+toolbar("Search decisions…")+'<div class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Decision</th><th>Meeting date</th><th>Outcome</th><th>Follow-through</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5"><div class="empty"><b>No decisions found</b>Record an outcome to make it visible to your community.</div></td></tr>')+'</tbody></table></div></div>'
    }
    function actionsPage(){
      let list=data.actions.slice().sort((a,b)=>(a.status==="Completed")-(b.status==="Completed")||a.due.localeCompare(b.due)).filter(a=>(a.title+" "+a.owner+" "+a.status).toLowerCase().includes(search.toLowerCase()));
      if(filter!=="all")list=list.filter(a=>filter==="overdue"?late(a):filter==="open"?a.status!=="Completed":a.status===filter);
      const rows=list.map(a=>{const d=decision(a.decision);return '<tr><td><div class="table-title">'+esc(a.title)+'</div><div class="table-sub">'+esc(d?d.title:"Community follow-up")+'</div></td><td><div class="owner"><span class="avatar" style="background:#688c79">'+initials(a.owner)+'</span>'+esc(a.owner)+'</div></td><td>'+fmt(a.due)+'</td><td><span class="pill '+(late(a)?"late":a.status==="Completed"?"":a.status==="In progress"?"deferred":"pending")+'">'+(late(a)?"Overdue":esc(a.status))+'</span></td><td><button class="table-btn" data-reminder="'+esc(a.id)+'">'+(a.reminder?"● On":"○ Off")+'</button></td><td><select class="status-select" data-status="'+esc(a.id)+'" aria-label="Update status"><option '+(a.status==="To do"?"selected":"")+' value="To do">To do</option><option '+(a.status==="In progress"?"selected":"")+' value="In progress">In progress</option><option '+(a.status==="Completed"?"selected":"")+' value="Completed">Completed</option></select></td></tr>'}).join("");
      const filters='<select class="filter" id="action-filter" aria-label="Filter actions"><option value="all">All actions</option><option value="open">Open actions</option><option value="overdue">Overdue</option><option value="Completed">Completed</option></select>';
      return head("Decisions into action","Action items","Clear owners and due dates make it easier to follow through.",'<button class="btn primary" data-modal="action">＋ Add action item</button>')+toolbar("Search actions or owners…",filters)+'<div class="panel table-panel"><div class="table-wrap"><table><thead><tr><th>Action item</th><th>Owner</th><th>Deadline</th><th>Status</th><th>Reminder</th><th>Update</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6"><div class="empty"><b>No action items found</b>Try changing the filters or add a new action item.</div></td></tr>')+'</tbody></table></div></div><p style="font-size:10px;color:var(--muted)">Reminders are tracked in this browser. This prototype does not send email or push notifications.</p>'
    }
    function render(){
      const names={overview:"Overview",meetings:"Meetings",decisions:"Decision log",actions:"Action items",archive:"Meeting archive"};
      document.getElementById("crumb-current").textContent=names[page];document.getElementById("meeting-count").textContent=data.meetings.filter(m=>m.status==="upcoming").length;document.getElementById("action-count").textContent=data.actions.filter(a=>a.status!=="Completed").length;document.getElementById("today-label").textContent=now.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
      const root=document.getElementById("content");root.innerHTML=page==="overview"?overview():page==="meetings"?meetings(false):page==="decisions"?decisionsPage():page==="actions"?actionsPage():meetings(true);
      const s=document.getElementById("search");if(s)s.addEventListener("input",function(){search=this.value;const p=this.selectionStart;render();const n=document.getElementById("search");n.focus();n.setSelectionRange(p,p)});
      const f=document.getElementById("action-filter");if(f){f.value=filter;f.addEventListener("change",function(){filter=this.value;render()})}
      document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.page===page))
    }
    function goto(p){page=p;search="";document.getElementById("sidebar").classList.remove("open");render()}
    function meetingOptions(){return data.meetings.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+' · '+fmt(m.date,{month:"short",day:"numeric"})+'</option>').join("")||'<option value="">Create a meeting first</option>'}
    function openModal(kind,linked){
      let title,desc,fields;
      if(kind==="meeting"){title="Schedule a meeting";desc="Bring neighbors together around the things that matter.";fields='<div class="field full"><label>Meeting title *</label><input name="title" required placeholder="e.g. December residents’ committee"></div><div class="field"><label>Meeting type</label><select name="type"><option>Monthly committee</option><option>Annual general meeting</option><option>Special meeting</option><option>Resident forum</option></select></div><div class="field"><label>Date *</label><input name="date" type="date" min="'+today+'" value="'+today+'" required></div><div class="field"><label>Start time</label><input name="time" type="time" value="18:30"></div><div class="field"><label>Location *</label><input name="location" required placeholder="Clubhouse · Hall A"></div><div class="field"><label>Expected attendees</label><input name="attendance" type="number" min="1" value="5"></div><div class="field full"><label>Agenda topics</label><textarea name="agenda" placeholder="One topic per line"></textarea><div class="hint">Add one topic per line. You can refine this later.</div></div>'}
      else if(kind==="decision"){title="Record a decision";desc="Capture the outcome so it can be shared and acted on.";fields='<div class="field full"><label>Decision summary *</label><textarea name="title" required placeholder="What did the group decide?"></textarea></div><div class="field"><label>Meeting</label><select name="meeting">'+meetingOptions()+'</select></div><div class="field"><label>Outcome</label><select name="outcome"><option>Approved</option><option>Deferred</option><option>Rejected</option><option>Noted</option></select></div><div class="field"><label>Decision date</label><input name="date" type="date" value="'+today+'"></div>'}
      else {title="Create an action item";desc="Assign one clear owner and a realistic deadline.";fields='<div class="field full"><label>Action item *</label><input name="title" required placeholder="What needs to be done?"></div><div class="field"><label>Assigned to *</label><input name="owner" required placeholder="Name of the owner"></div><div class="field"><label>Deadline *</label><input name="due" type="date" required></div><div class="field full"><label>Linked decision</label><select name="decision"><option value="">No linked decision</option>'+data.decisions.map(d=>'<option value="'+esc(d.id)+'" '+(d.id===linked?"selected":"")+'>'+esc(d.title)+'</option>').join("")+'</select></div><div class="field full"><label><input type="checkbox" name="reminder" checked style="accent-color:var(--green)"> Keep a reminder on this item</label><div class="hint">Saved locally in this browser. No message is sent.</div></div>'}
      document.getElementById("modal-root").innerHTML='<div class="backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><h2 id="modal-title">'+title+'</h2><p>'+desc+'</p></div><button class="close" type="button" aria-label="Close" data-close>×</button></header><form id="modal-form" data-kind="'+kind+'"><div class="modal-body"><div class="form-grid">'+fields+'</div><div class="modal-foot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save '+(kind==="meeting"?"meeting":kind==="decision"?"decision":"action")+'</button></div></div></form></section></div>';
      const focus=document.querySelector("#modal-root input:not([type=checkbox]),#modal-root textarea");if(focus)focus.focus()
    }
    function closeModal(){document.getElementById("modal-root").innerHTML=""}
    function meetingDetails(id){
      const m=byId(id);if(!m)return;const ds=data.decisions.filter(d=>d.meeting===id),ag=m.agenda.length?m.agenda:["No agenda topics added."];
      document.getElementById("modal-root").innerHTML='<div class="backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><p class="eyebrow">'+esc(m.type)+' · '+fmt(m.date)+'</p><h2 id="modal-title">'+esc(m.title)+'</h2><p>'+esc(m.time)+' · '+esc(m.location)+'</p></div><button class="close" type="button" aria-label="Close" data-close>×</button></header><div class="modal-body"><div class="panel" style="box-shadow:none;padding:13px;margin:0 0 13px"><b class="panel-title">Agenda</b><ol style="font-size:10px;line-height:1.8;padding-left:17px">'+ag.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol></div><div class="field"><label for="attendees">Attendance record <span style="font-weight:400;color:var(--muted)">· one name per line</span></label><textarea id="attendees" placeholder="Add the names of residents who attended…">'+esc((m.attendees||[]).join("\n"))+'</textarea></div><div class="field" style="margin-top:11px"><label for="minutes">Minutes & notes</label><textarea id="minutes" style="min-height:85px" placeholder="Record the discussion and context…">'+esc(m.minutes||"")+'</textarea></div><p class="hint">'+((m.attendees||[]).length?m.attendees.length+" present":"Attendance not recorded")+" · "+m.attendance+' invited · '+ds.length+' decision'+(ds.length===1?"":"s")+' recorded</p><div class="modal-foot" style="justify-content:space-between"><button class="btn" data-archive="'+esc(id)+'">'+(m.archived?"Restore meeting":"Archive meeting")+'</button><div style="display:flex;gap:8px"><button class="btn" data-close>Close</button><button class="btn primary" data-save-minutes="'+esc(id)+'">Save meeting record</button></div></div></div></section></div>'
    }
    document.addEventListener("click",function(e){
      const t=e.target.closest("[data-page],[data-modal],[data-close],[data-open-meeting],[data-archive],[data-save-minutes],[data-reminder],[data-action-for]");
      if(!t){if(e.target.id==="backdrop")closeModal();return}
      if(t.dataset.page)goto(t.dataset.page);
      else if(t.dataset.modal)openModal(t.dataset.modal);
      else if(t.hasAttribute("data-close"))closeModal();
      else if(t.dataset.openMeeting)meetingDetails(t.dataset.openMeeting);
      else if(t.dataset.archive){const m=byId(t.dataset.archive);m.archived=!m.archived;m.status=m.archived?"completed":"upcoming";save();closeModal();render();toast(m.archived?"Meeting moved to archive.":"Meeting restored.")}
      else if(t.dataset.saveMinutes){const m=byId(t.dataset.saveMinutes);m.minutes=document.getElementById("minutes").value;save();closeModal();render();toast("Meeting minutes saved.")}
      else if(t.dataset.reminder){const a=data.actions.find(x=>x.id===t.dataset.reminder);a.reminder=!a.reminder;save();render();toast("Reminder "+(a.reminder?"turned on.":"turned off."))}
      else if(t.dataset.actionFor)openModal("action",t.dataset.actionFor)
    });
    document.addEventListener("submit",function(e){
      if(e.target.id!=="modal-form")return;e.preventDefault();const f=e.target,d=new FormData(f),kind=f.dataset.kind;
      if(kind==="meeting"){const agenda=String(d.get("agenda")||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);data.meetings.push({id:idFor("m",data.meetings),title:String(d.get("title")).trim(),type:String(d.get("type")),date:String(d.get("date")),time:String(d.get("time")||"18:30"),location:String(d.get("location")).trim(),attendance:Math.max(1,Number(d.get("attendance"))||1),agenda,minutes:"",status:"upcoming",archived:false});save();closeModal();goto("meetings");toast("Meeting scheduled.")}
      else if(kind==="decision"){const meeting=String(d.get("meeting")||"");if(!meeting){toast("Schedule a meeting before recording a decision.");return}data.decisions.push({id:idFor("d",data.decisions),title:String(d.get("title")).trim(),meeting,outcome:String(d.get("outcome")),date:String(d.get("date")||today)});save();closeModal();goto("decisions");toast("Decision added to the log.")}
      else{data.actions.push({id:idFor("a",data.actions),title:String(d.get("title")).trim(),owner:String(d.get("owner")).trim(),due:String(d.get("due")),status:"To do",reminder:d.get("reminder")==="on",decision:String(d.get("decision")||"")});save();closeModal();goto("actions");toast("Action item assigned.")}
    });
    document.addEventListener("change",function(e){const id=e.target.dataset.status;if(!id)return;const a=data.actions.find(x=>x.id===id);if(a){a.status=e.target.value;save();render();toast("Action status updated.")}});
    document.getElementById("menu-toggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
    document.getElementById("reminder-button").addEventListener("click",()=>{const a=data.actions.filter(x=>x.reminder&&x.status!=="Completed");toast(a.length?a.length+" active reminders · "+a.filter(late).length+" overdue":"No active reminders.")});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    document.getElementById("today-label").textContent=now.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});render()
  })();
  </script>
</body>
</html>
